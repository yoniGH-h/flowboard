# הגדרת האירוח ב-Render (Blueprint): מסד נתונים, השרת והאתר - להדגמה בלבד.
# שימוש: ב-Render בוחרים New -> Blueprint ומחברים את המאגר הזה.
# לא משפיע על ההרצה המקומית (start-dev.ps1).

databases:
  - name: flowboard-db
    plan: free
    databaseName: flowboard
    user: flowboard

services:
  # השרת (Express). בכל העלאה: בניית הטבלאות וטעינה מחדש של נתוני הדמו.
  - type: web
    name: flowboard-api
    runtime: node
    plan: free
    rootDir: backend-express
    buildCommand: npm install && npx prisma migrate deploy && node prisma/seed.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowboard-db
          property: connectionString
      # שני הסודות נוצרים אוטומטית על ידי Render.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # האתר והשרת יושבים על שתי כתובות, ולכן עוגיית הרענון לא נשלחת.
      # אסימון גישה ארוך מונע ניתוק באמצע ההדגמה. לא מתאים לאתר אמיתי.
      - key: JWT_ACCESS_TTL
        value: 12h
      # כתובת האתר (flowboard-web), בלי / בסוף. ממלאים ב-Render.
      - key: CORS_ORIGIN
        sync: false

  # האתר (React): קבצים סטטיים אחרי בנייה.
  - type: web
    name: flowboard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # SPA: כל כתובת מחזירה את index.html, ו-React Router בוחר את המסך.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      # כתובת השרת (flowboard-api) עם /api בסוף. ממלאים ב-Render.
      - key: VITE_API_URL
        sync: false
      # מציג את כפתורי חשבונות הדמו במסך ההתחברות.
      - key: VITE_DEMO_MODE
        value: "true"
